name: CI / Build & Publish image

# Firewalled server (no inbound SSH from CI) → pull-based deploy:
# CI builds the app and publishes a Docker image to GHCR; the server pulls it
# (via Watchtower or `docker pull`), matching the other ghcr.io/kareem-3del/* apps.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  image:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kareem-3del/zaki-llm:latest
            ghcr.io/kareem-3del/zaki-llm:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
