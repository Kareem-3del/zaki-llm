name: CI / Deploy

# Builds on every push/PR; deploys to the server on push to main.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST      e.g. 76.13.151.228
#   DEPLOY_PORT      e.g. 2222
#   DEPLOY_USER      e.g. root
#   DEPLOY_SSH_KEY   a PRIVATE key authorized on the server (use a DEDICATED deploy key,
#                    not your personal key) — add its public half to the server's authorized_keys
#   DEPLOY_PATH      e.g. /opt/zaki   (optional; defaults to /opt/zaki)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            APP_DIR="${APP_DIR:-/opt/zaki}"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch --all
            git reset --hard origin/main
            npm ci
            npm run build
            # restart under pm2 (install if missing)
            command -v pm2 >/dev/null 2>&1 || npm i -g pm2
            pm2 describe zaki >/dev/null 2>&1 \
              && pm2 restart zaki --update-env \
              || pm2 start "npm run start" --name zaki
            pm2 save
