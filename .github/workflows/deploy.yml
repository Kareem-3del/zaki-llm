name: CI / Deploy

# Builds on every push/PR; deploys to the server on push to main.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST      e.g. 76.13.151.228
#   DEPLOY_PORT      e.g. 2222
#   DEPLOY_USER      e.g. root
#   DEPLOY_SSH_KEY   a PRIVATE key authorized on the server (use a DEDICATED deploy key,
#                    not your personal key) — add its public half to the server's authorized_keys
#   DEPLOY_PATH      e.g. /opt/zaki   (optional; defaults to /opt/zaki)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            APP_DIR="${APP_DIR:-/opt/zaki}"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch --all
            git reset --hard origin/main
            [ -f .env.local ] || printf 'OLLAMA_BASE_URL=http://127.0.0.1:11434\nZAKI_AUTH_SECRET=%s\n' "$(openssl rand -hex 32)" > .env.local
            # Build image and (re)run as a Traefik-routed container on the shared network.
            docker build -t zaki:latest .
            docker rm -f zaki 2>/dev/null || true
            docker run -d --name zaki --restart unless-stopped \
              --network traefik-public \
              --env-file "$APP_DIR/.env.local" \
              -l traefik.enable=true \
              -l 'traefik.http.routers.zaki.rule=Host(`llm.kareem-3del.com`)' \
              -l traefik.http.routers.zaki.entrypoints=websecure \
              -l traefik.http.routers.zaki.tls=true \
              -l traefik.http.routers.zaki.tls.certresolver=letsencrypt \
              -l traefik.http.services.zaki.loadbalancer.server.port=3000 \
              zaki:latest
            docker image prune -f >/dev/null 2>&1 || true
